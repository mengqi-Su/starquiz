<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>智题 StarQuiz - 备考练习平台</title>
  <meta name="description" content="把备考规划里的考试、资料和真题变成练习：学习模式查漏补缺，考试模式自检掌握度">
  <meta name="theme-color" content="#f8f7f4">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231c1b1a'/><rect x='10' y='10' width='80' height='80' rx='16' fill='none' stroke='%23f8f7f4' stroke-width='2.5' stroke-opacity='0.5'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='%23f8f7f4' font-family='PingFang SC,Microsoft YaHei,sans-serif' font-weight='600'>智</text></svg>">
  <link rel="stylesheet" href="style.css?v=104">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark" data-no-i18n>智</div>
        <h1>智题 STARQUIZ</h1>
        <button type="button" class="sidebar-collapse" onclick="collapseSidebar()" title="收起侧栏" aria-label="收起侧栏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4.5" width="18" height="15" rx="2"/>
            <path d="M13 4.5v15M10 9.5 7.5 12 10 14.5"/>
          </svg>
        </button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav" aria-label="主导航"></nav>
      <div class="sidebar-group" id="sidebarSubjects" aria-label="练习科目列表"></div>
      <div class="sidebar-bottom" id="sidebarBottom"></div>
    </aside>
    <button type="button" class="sidebar-expand" id="sidebarExpand" onclick="expandSidebar()" title="展开侧栏" aria-label="展开侧栏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4.5" width="18" height="15" rx="2"/>
        <path d="M13 4.5v15M9.5 9.5 12 12l-2.5 2.5"/>
      </svg>
    </button>

    <!-- Overlay for mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <div class="main-content">
      <header class="main-header">
        <div class="header-left">
          <span class="header-brand" aria-hidden="true" data-no-i18n>智</span>
          <h2 id="pageTitle">首页</h2>
        </div>
        <div class="header-actions" id="headerActions"></div>
      </header>
      <div class="resume-slot" id="resumeSlot" aria-live="polite"></div>
      <main class="main-body" id="mainContent">
        <!-- Dynamic content rendered here -->
      </main>
    </div>
  </div>

  <!-- 移动端底栏：与桌面侧栏同一份 NAV_VIEWS 渲染，这里只留容器 -->
  <nav class="bottom-nav" id="bottomNav" aria-label="主导航"></nav>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Modal container -->
  <div id="modalContainer"></div>

  <script src="data.js?v=4"></script>
  <script src="topicKey.js?v=1"></script>
  <script src="i18n.js?v=38"></script>
  <script src="app.js?v=118"></script>
</body>
</html>
