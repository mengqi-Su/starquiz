<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>智题 StarQuiz - 高效刷题平台</title>
  <meta name="description" content="支持普通题目和编程题的在线刷题复习平台，学习模式与考试模式双模式切换">
  <meta name="theme-color" content="#f8f7f4">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231c1b1a'/><rect x='10' y='10' width='80' height='80' rx='16' fill='none' stroke='%23f8f7f4' stroke-width='2.5' stroke-opacity='0.5'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='%23f8f7f4' font-family='PingFang SC,Microsoft YaHei,sans-serif' font-weight='600'>智</text></svg>">
  <link rel="stylesheet" href="style.css?v=89">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">智</div>
        <h1>智题 STARQUIZ</h1>
        <button type="button" class="sidebar-collapse" onclick="collapseSidebar()" title="收起侧栏" aria-label="收起侧栏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4.5" width="18" height="15" rx="2"/>
            <path d="M13 4.5v15M10 9.5 7.5 12 10 14.5"/>
          </svg>
        </button>
      </div>
      <nav class="sidebar-nav" aria-label="主导航">
        <button class="nav-item active" data-view="dashboard" onclick="navigateTo('dashboard')">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.5 10.5 12 3.5l8.5 7v9a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/>
            </svg>
          </span>
          首页
        </button>
        <button class="nav-item" data-view="sets" onclick="navigateTo('sets')">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l2 2.2h7.4a2 2 0 0 1 2 2v8.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>
            </svg>
          </span>
          学科
        </button>
        <button class="nav-item" data-view="records" onclick="navigateTo('records')">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 20V4"/>
              <path d="M4 20h16"/>
              <path d="M8.5 16v-4.5M13 16V7.5M17.5 16v-6.5"/>
            </svg>
          </span>
          进度
        </button>
      </nav>
      <div class="sidebar-group" id="sidebarSubjects" aria-label="学科列表"></div>
      <div class="sidebar-bottom">
        <button class="nav-item" data-view="settings" onclick="navigateTo('settings')">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 7h9M18 7h1M5 12h4M13 12h6M5 17h9M18 17h1"/>
              <circle cx="16" cy="7" r="2"/>
              <circle cx="11" cy="12" r="2"/>
              <circle cx="16" cy="17" r="2"/>
            </svg>
          </span>
          设置
        </button>
      </div>
    </aside>
    <button type="button" class="sidebar-expand" id="sidebarExpand" onclick="expandSidebar()" title="展开侧栏" aria-label="展开侧栏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4.5" width="18" height="15" rx="2"/>
        <path d="M13 4.5v15M9.5 9.5 12 12l-2.5 2.5"/>
      </svg>
    </button>

    <!-- Overlay for mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <div class="main-content">
      <header class="main-header">
        <div class="header-left">
          <span class="header-brand" aria-hidden="true">智</span>
          <h2 id="pageTitle">首页</h2>
        </div>
        <div class="header-actions" id="headerActions"></div>
      </header>
      <div class="resume-slot" id="resumeSlot" aria-live="polite"></div>
      <main class="main-body" id="mainContent">
        <!-- Dynamic content rendered here -->
      </main>
    </div>
  </div>

  <!-- Mobile bottom navigation -->
  <nav class="bottom-nav" aria-label="主导航">
    <button class="bn-item active" data-view="dashboard" onclick="navigateTo('dashboard')">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 10.5 12 3.5l8.5 7v9a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/>
        </svg>
      </span>
      首页
    </button>
    <button class="bn-item" data-view="sets" onclick="navigateTo('sets')">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l2 2.2h7.4a2 2 0 0 1 2 2v8.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>
        </svg>
      </span>
      学科
    </button>
    <button class="bn-item" data-view="records" onclick="navigateTo('records')">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20V4"/>
          <path d="M4 20h16"/>
          <path d="M8.5 16v-4.5M13 16V7.5M17.5 16v-6.5"/>
        </svg>
      </span>
      进度
    </button>
    <button class="bn-item" data-view="settings" onclick="navigateTo('settings')">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 7h9M18 7h1M5 12h4M13 12h6M5 17h9M18 17h1"/>
          <circle cx="16" cy="7" r="2"/>
          <circle cx="11" cy="12" r="2"/>
          <circle cx="16" cy="17" r="2"/>
        </svg>
      </span>
      设置
    </button>
  </nav>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Modal container -->
  <div id="modalContainer"></div>

  <script src="data.js?v=4"></script>
  <script src="topicKey.js?v=1"></script>
  <script src="i18n.js?v=14"></script>
  <script src="app.js?v=93"></script>
</body>
</html>
